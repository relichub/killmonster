name: Update Kill Monster statistics
on:
  schedule:
    - cron: '17 11 * * *'
    - cron: '17 12 * * *'
    # Temporary scheduled verification; remove after observing the run.
    - cron: '24 12 25 10 *'
  workflow_dispatch:
    inputs:
      sync_only:
        description: Forward saved data only (no TibiaRelic request)
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: killmonster-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update once or retry a failed daily attempt
        env:
          SYNC_ONLY: ${{ inputs.sync_only }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SYNC_ONLY" = "true" ]; then
            echo "Reusing the saved snapshot. No TibiaRelic API request."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 update_statistics.py manual
          elif [ "$EVENT_SCHEDULE" = "17 12 * * *" ]; then
            python3 -c 'import json; import update_statistics as u; p=u.ROOT/"update-status.json"; s=json.loads(p.read_text()) if p.exists() else {}; today=(u.now()-u.timedelta(hours=3)).date().isoformat(); u.run("retry" if s.get("day")==today and s.get("attempts",0)>=1 else "daily")'
          else
            python3 update_statistics.py daily
          fi
      - name: Save validated data and availability status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html update-status.json
          if [ -f killstatistics.json ]; then git add killstatistics.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update statistics and availability status"
            git push origin HEAD:main
          fi
      - name: Deliver saved data to private Amigos database
        id: amigos_delivery
        continue-on-error: true
        env:
          AMIGOS_SYNC_KEY: ${{ secrets.AMIGOS_SYNC_KEY }}
        run: python3 sync_amigos.py
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
