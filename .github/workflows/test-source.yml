name: Test TibiaRelic kill statistics API

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-source.yml'

permissions:
  contents: read

jobs:
  check-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Make one request to the supplied public API
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          url = 'https://api.tibiarelic.com/api/killstatistics?worldname=relic'
          report = {'source': url, 'checked_at': datetime.now(timezone.utc).isoformat(), 'success': False, 'requests': 1}
          try:
              request = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'RelicHub-killmonster-source-test/1.0'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  report['http_status'] = response.status
                  raw = response.read(5000000)
              data = json.loads(raw)
              if not isinstance(data, (dict, list)) or not data:
                  raise ValueError('Expected nonempty JSON data')
              Path('killstatistics.json').write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
              lists = []
              def inspect(value, path='root', depth=0):
                  if isinstance(value, list):
                      lists.append((path, value))
                  elif isinstance(value, dict) and depth < 4:
                      for key, child in value.items():
                          inspect(child, path + '.' + key, depth + 1)
              inspect(data)
              path, rows = max(lists, key=lambda pair: len(pair[1])) if lists else ('root', [])
              if len(rows) < 10:
                  raise ValueError('JSON received, but no usable creature table was identified')
              report.update(success=True, json_type=type(data).__name__, bytes=len(raw), record_path=path, record_count=len(rows), sample=rows[:2], top_level_keys=list(data.keys())[:20] if isinstance(data, dict) else [])
              print(json.dumps(report, ensure_ascii=False, indent=2))
          except urllib.error.HTTPError as error:
              report.update(http_status=error.code, error=str(error), retry_after=error.headers.get('Retry-After'))
              print(json.dumps(report, indent=2))
          except Exception as error:
              report['error'] = str(error)
              print(json.dumps(report, indent=2))
          finally:
              Path('api-test-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
              summary = ['## Direct TibiaRelic API test', '', 'Result: ' + ('SUCCESS' if report['success'] else 'FAILED'), '', '- Requests: 1', '- HTTP status: ' + str(report.get('http_status')), '- Creature records: ' + str(report.get('record_count', 0)), '- Checked at: ' + report['checked_at']]
              if report.get('error'):
                  summary.append('- Error: ' + report['error'])
              if report.get('success'):
                  summary += ['', 'JSON path: ' + report['record_path'], '', 'Sample:', '', '```json', json.dumps(report.get('sample', []), ensure_ascii=False, indent=2), '```']
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
                  output.write(chr(10).join(summary))
          if not report['success']:
              raise SystemExit(1)
          PY
      - name: Save API test data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tibiarelic-api-test
          path: |
            api-test-report.json
            killstatistics.json
          retention-days: 7
