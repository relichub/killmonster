name: Publish Monster Kill website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - site.css
      - statistics.js
      - enhancements.js
      - 'assets/**'
      - .github/workflows/publish-site.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: monster-kill-static-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static website only
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          for file in site.css statistics.js enhancements.js; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
          if [ -d assets ]; then cp -R assets _site/assets; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
